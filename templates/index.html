<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>水印小程序</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Sync the Mini App with Telegram: expand to full height and follow the
    // user's Telegram theme (light/dark). Falls back to the browser's
    // prefers-color-scheme when opened outside Telegram.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      function applyTheme(dark) {
        document.documentElement.classList.toggle('tg-dark', !!dark);
      }
      if (tg) {
        try { tg.ready(); tg.expand(); } catch (e) {}
        applyTheme(tg.colorScheme === 'dark');
        try {
          tg.onEvent('themeChanged', function () { applyTheme(tg.colorScheme === 'dark'); });
        } catch (e) {}
      } else if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        applyTheme(mq.matches);
        if (mq.addEventListener) {
          mq.addEventListener('change', function (e) { applyTheme(e.matches); });
        }
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(59,130,246,.1), 0 2px 8px rgba(0,0,0,.05);
      padding: 36px 40px;
      width: 100%;
      max-width: 560px;
      border: 1px solid rgba(255,255,255,.8);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: #0f172a;
      letter-spacing: -.02em;
    }

    .subtitle {
      font-size: .9rem;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: .82rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="file"],
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: .95rem;
      outline: none;
      background: #f8fafc;
      color: #1e293b;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input[type="text"]:focus,
    select:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }

    input[type="range"] { width: 100%; accent-color: #3b82f6; cursor: pointer; }

    .opacity-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .opacity-row input[type="range"] { flex: 1; }

    .opacity-val {
      min-width: 36px;
      text-align: right;
      font-weight: 700;
      color: #3b82f6;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .checkbox-row span { font-size: .95rem; }

    .hint {
      font-size: .77rem;
      color: #94a3b8;
      margin-top: 5px;
      line-height: 1.6;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .18s, box-shadow .18s, transform .12s;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(59,130,246,.35);
      letter-spacing: .01em;
    }

    .btn:hover { opacity: .92; box-shadow: 0 6px 22px rgba(59,130,246,.45); }
    .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn:active { transform: scale(.98); }

    /* Progress */
    #progress-wrap {
      display: none;
      margin-top: 20px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #progress-text { font-size: .9rem; color: #64748b; }

    /* Result */
    #result-wrap {
      display: none;
      margin-top: 20px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    #result-wrap .icon { font-size: 2rem; margin-bottom: 6px; }
    #result-wrap p { margin-bottom: 12px; font-size: .95rem; color: #166534; font-weight: 700; }

    .download-btn {
      display: inline-block;
      padding: 11px 32px;
      background: #10b981;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      transition: background .18s, box-shadow .18s;
      box-shadow: 0 2px 10px rgba(16,185,129,.3);
    }

    .download-btn:hover { background: #059669; box-shadow: 0 4px 16px rgba(16,185,129,.4); }

    /* Error */
    #error-wrap {
      display: none;
      margin-top: 20px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: .9rem;
      color: #b91c1c;
    }

    .divider {
      border: none;
      border-top: 1px solid #f1f5f9;
      margin: 24px 0 20px;
    }

    /* ── Preview & drag positioning ────────────────────────────────────────── */
    #preview-wrap { display: none; margin: 10px 0 6px; }

    .preview-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .78rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    #pos-readout { color: #3b82f6; font-weight: 700; }

    #preview-container {
      position: relative;
      width: 100%;
      height: 280px;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      cursor: crosshair;
    }

    #preview-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    #wm-drag {
      position: absolute;
      background: rgba(0,0,0,.45);
      color: rgba(255,255,255,.95);
      padding: 3px 10px;
      border-radius: 5px;
      font-size: .82rem;
      white-space: nowrap;
      max-width: 75%;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: grab;
      border: 1.5px dashed rgba(255,255,255,.75);
      transform: translate(-50%, -50%);
      left: 88%; top: 88%;
      user-select: none;
      touch-action: none;
      z-index: 10;
      transition: box-shadow .1s;
    }

    #wm-drag:active { cursor: grabbing; box-shadow: 0 0 0 2px #3b82f6; }
    #wm-drag.hidden { display: none; }

    #tiled-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: .88rem;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      pointer-events: none;
    }

    #tiled-overlay.active { display: flex; }

    /* ── Dark theme (follows Telegram colorScheme / prefers-color-scheme) ── */
    html.tg-dark body { background: linear-gradient(135deg, #17212b 0%, #1b2330 100%); color: #e7eef5; }
    html.tg-dark .card { background: #232e3c; border-color: #2b3a47; box-shadow: 0 4px 32px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3); }
    html.tg-dark h1 { color: #f1f5f9; }
    html.tg-dark .subtitle { color: #8a9aa8; }
    html.tg-dark label { color: #aebcc8; }
    html.tg-dark input[type="text"],
    html.tg-dark input[type="file"],
    html.tg-dark select { background: #1b2733; border-color: #2b3a47; color: #e7eef5; }
    html.tg-dark input[type="text"]:focus,
    html.tg-dark select:focus { background: #1b2733; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
    html.tg-dark .hint { color: #7e8c99; }
    html.tg-dark .divider { border-top-color: #2b3a47; }
    html.tg-dark .preview-label { color: #8a9aa8; }
    html.tg-dark #progress-wrap { background: #1b2733; border-color: #2b3a47; }
    html.tg-dark #progress-text { color: #aebcc8; }
    html.tg-dark .spinner { border-color: #2b3a47; border-top-color: #3b82f6; }
    html.tg-dark #result-wrap { background: rgba(16,185,129,.12); border-color: rgba(16,185,129,.35); }
    html.tg-dark #result-wrap p { color: #6ee7b7; }
    html.tg-dark #error-wrap { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.35); color: #fca5a5; }
  </style>
</head>
<body>
<div class="card">
  <h1>🖼️ 水印小程序</h1>
  <p class="subtitle">支持图片（JPG / PNG / WebP）和视频（MP4 / MOV）</p>

  <form id="wm-form" enctype="multipart/form-data">

    <!-- 文件上传 -->
    <div class="field">
      <label for="file">上传文件 <span style="color:#e74c3c">*</span></label>
      <input type="file" id="file" name="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov" required />
      <p class="hint">支持 jpg / png / webp / mp4 / mov，最大 200 MB（超出将被拒绝）</p>
    </div>

    <!-- 图片预览 & 拖动定位 -->
    <div id="preview-wrap">
      <div class="preview-label">
        <span>📍 拖动水印标签调整位置，或点击图片直接定位</span>
        <span id="pos-readout"></span>
      </div>
      <div id="preview-container">
        <img id="preview-img" src="" alt="预览" draggable="false" />
        <div id="wm-drag">© Wei</div>
        <div id="tiled-overlay">🔲 全图平铺模式，位置不生效</div>
      </div>
      <p class="hint" style="margin-top:5px;">仅图片支持拖动定位；位置会精确映射到原图</p>
    </div>

    <hr class="divider" />

    <!-- 水印文字 -->
    <div class="field">
      <label for="text">水印文字</label>
      <input type="text" id="text" name="text" value="© Wei" placeholder="请输入水印文字" />
    </div>

    <!-- 水印位置 -->
    <div class="field" id="position-field">
      <label for="position">水印位置</label>
      <select id="position" name="position">
        <option value="右下" selected>右下角</option>
        <option value="左上">左上角</option>
        <option value="右上">右上角</option>
        <option value="左下">左下角</option>
        <option value="居中">居中</option>
      </select>
    </div>

    <!-- 透明度 -->
    <div class="field">
      <label for="opacity">透明度</label>
      <div class="opacity-row">
        <input type="range" id="opacity" name="opacity" min="0" max="100" value="75"
               oninput="document.getElementById('opacity-val').textContent = this.value + '%'" />
        <span class="opacity-val" id="opacity-val">75%</span>
      </div>
    </div>

    <!-- 平铺 -->
    <div class="field">
      <label>平铺水印</label>
      <label class="checkbox-row">
        <input type="checkbox" id="tiled" />
        <span>全图平铺（忽略位置设置）</span>
      </label>
    </div>

    <!-- Logo 上传 -->
    <div class="field">
      <label for="logo">Logo 图片（可选）</label>
      <input type="file" id="logo" name="logo" accept=".jpg,.jpeg,.png,.webp" />
      <p class="hint">上传后将用 Logo 替代文字水印</p>
    </div>

    <!-- Logo 大小（仅 Logo 模式显示） -->
    <div class="field" id="logo-scale-field" style="display:none;">
      <label for="logo_scale">图片水印大小</label>
      <div class="opacity-row">
        <input type="range" id="logo_scale" name="logo_scale" min="5" max="50" value="20"
               oninput="document.getElementById('logo-scale-val').textContent = this.value + '%'" />
        <span class="opacity-val" id="logo-scale-val">20%</span>
      </div>
      <p class="hint">占图片短边的百分比（5%–50%）</p>
    </div>

    <!-- Hidden: custom drag position (set by JS, image only) -->
    <input type="hidden" id="pos_x" name="pos_x" value="" />
    <input type="hidden" id="pos_y" name="pos_y" value="" />

    <!-- 提交 -->
    <button type="submit" class="btn" id="submit-btn">开始添加水印</button>
  </form>

  <!-- 进行中 -->
  <div id="progress-wrap">
    <div class="spinner"></div>
    <p id="progress-text">正在处理，请稍候…</p>
  </div>

  <!-- 成功 -->
  <div id="result-wrap">
    <div class="icon">✅</div>
    <p>水印添加成功！</p>
    <a id="download-link" class="download-btn" href="#" download>📥 下载文件</a>
  </div>

  <!-- 失败 -->
  <div id="error-wrap"></div>
</div>

<script>
  const form       = document.getElementById('wm-form');
  const submitBtn  = document.getElementById('submit-btn');
  const progressWrap = document.getElementById('progress-wrap');
  const resultWrap   = document.getElementById('result-wrap');
  const errorWrap    = document.getElementById('error-wrap');
  const downloadLink = document.getElementById('download-link');

  // iOS WebKit / Telegram Mini App webviews intermittently reject `fetch()`
  // POSTs that carry a file in FormData with "TypeError: Load failed".
  // XMLHttpRequest is far more robust for multipart uploads in these webviews.
  function xhrPostForm(url, formData) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('X-Requested-With', 'fetch');
      xhr.onload = () => {
        resolve({
          ok: xhr.status >= 200 && xhr.status < 300,
          status: xhr.status,
          json: () => {
          try { return Promise.resolve(JSON.parse(xhr.responseText || '{}')); }
          catch (e) { return Promise.reject(e); }
        },
        });
      };
      xhr.onerror = () => reject(new TypeError('网络连接失败，请重试'));
      xhr.ontimeout = () => reject(new TypeError('请求超时，请重试'));
      xhr.send(formData);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Reset UI
    resultWrap.style.display  = 'none';
    errorWrap.style.display   = 'none';
    progressWrap.style.display = 'block';
    submitBtn.disabled = true;

    // Build FormData — handle tiled checkbox manually (backend expects string)
    const fd = new FormData(form);
    const tiledChecked = document.getElementById('tiled').checked;
    // FormData won't include unchecked checkboxes; we always set it explicitly
    fd.delete('tiled');
    fd.append('tiled', tiledChecked ? 'true' : 'false');

    // Custom drag position — only send for images with a valid position set
    const _posX = document.getElementById('pos_x').value;
    const _posY = document.getElementById('pos_y').value;
    fd.delete('pos_x');
    fd.delete('pos_y');
    if (_posX && _posY && !tiledChecked) {
      fd.append('pos_x', _posX);
      fd.append('pos_y', _posY);
    }

    try {
      const resp = await xhrPostForm('/add_watermark', fd);
      const data = await resp.json();

      progressWrap.style.display = 'none';

      if (data.success) {
        downloadLink.href     = data.download_url;
        downloadLink.download = data.filename;
        resultWrap.style.display = 'block';
      } else {
        errorWrap.textContent    = '❌ 处理失败：' + (data.error || '未知错误');
        errorWrap.style.display  = 'block';
      }
    } catch (err) {
      progressWrap.style.display = 'none';
      errorWrap.textContent   = '❌ 请求出错：' + err.message;
      errorWrap.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

<script>
// ── Preview & drag positioning ──────────────────────────────────────────────
const previewWrap      = document.getElementById('preview-wrap');
const previewContainer = document.getElementById('preview-container');
const previewImg       = document.getElementById('preview-img');
const wmDrag           = document.getElementById('wm-drag');
const tiledOverlay     = document.getElementById('tiled-overlay');
const posXInput        = document.getElementById('pos_x');
const posYInput        = document.getElementById('pos_y');
const posReadout       = document.getElementById('pos-readout');
const textInput        = document.getElementById('text');
const tiledCheck       = document.getElementById('tiled');
const positionField    = document.getElementById('position-field');
const positionSelect   = document.getElementById('position');
const logoInput        = document.getElementById('logo');

const IMAGE_EXTS = new Set(['jpg', 'jpeg', 'png', 'webp']);

// Edge constraints: watermark position range from 2% to 98% of image dimensions
const MIN_POS = 2, MAX_POS = 98;
// Preset snap positions as % of image dimensions (12% and 88% provide edge margins, 50% for center)
const SNAP = {
  '右下': [88, 88], '左上': [12, 12],
  '右上': [88, 12], '左下': [12, 88], '居中': [50, 50],
};

/**
 * Returns the rendered image rectangle inside the container,
 * accounting for object-fit: contain letterboxing.
 */
function getImageRect() {
  const cw = previewContainer.clientWidth;
  const ch = previewContainer.clientHeight;
  const nw = previewImg.naturalWidth  || cw;
  const nh = previewImg.naturalHeight || ch;
  const imgR = nw / nh;
  const conR = cw / ch;
  let rw, rh, rx, ry;
  if (imgR > conR) { rw = cw; rh = cw / imgR; rx = 0; ry = (ch - rh) / 2; }
  else             { rh = ch; rw = ch * imgR; ry = 0; rx = (cw - rw) / 2; }
  return { x: rx, y: ry, w: rw, h: rh };
}

/**
 * Move the drag handle to the given image-relative percentage (0–100),
 * and update the hidden form inputs.
 */
function placeDragAt(pctX, pctY) {
  const r = getImageRect();
  wmDrag.style.left = (r.x + r.w * pctX / 100) + 'px';
  wmDrag.style.top  = (r.y + r.h * pctY / 100) + 'px';
  posXInput.value = pctX.toFixed(2);
  posYInput.value = pctY.toFixed(2);
  posReadout.textContent = `X ${Math.round(pctX)}%  Y ${Math.round(pctY)}%`;
}

function snapToPreset(name) {
  const c = SNAP[name] || SNAP['右下'];
  placeDragAt(c[0], c[1]);
}

function updateWmLabel() {
  const hasLogo = logoInput.files && logoInput.files[0];
  wmDrag.textContent = hasLogo ? '🖼 Logo' : (textInput.value.trim() || '水印');
  document.getElementById('logo-scale-field').style.display = hasLogo ? '' : 'none';
}

function updateTiledUI() {
  const on = tiledCheck.checked;
  wmDrag.classList.toggle('hidden', on);
  tiledOverlay.classList.toggle('active', on);
}

// ── File change → show / hide preview ──────────────────────────────────────
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) { previewWrap.style.display = 'none'; return; }
  const ext = f.name.split('.').pop().toLowerCase();
  if (IMAGE_EXTS.has(ext)) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      previewImg.onload = () => {
        previewWrap.style.display  = 'block';
        positionField.style.display = 'none';
        posXInput.value = '';
        posYInput.value = '';
        updateWmLabel();
        updateTiledUI();
        snapToPreset(positionSelect.value);
      };
      previewImg.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  } else {
    previewWrap.style.display   = 'none';
    positionField.style.display = '';
    posXInput.value = '';
    posYInput.value = '';
  }
});

// ── Sync controls → preview ─────────────────────────────────────────────────
textInput.addEventListener('input',  updateWmLabel);
logoInput.addEventListener('change', updateWmLabel);
tiledCheck.addEventListener('change', updateTiledUI);

positionSelect.addEventListener('change', () => {
  if (previewWrap.style.display !== 'none') snapToPreset(positionSelect.value);
});

// ── Click on preview → set position ────────────────────────────────────────
previewContainer.addEventListener('click', (e) => {
  if (wmDrag.contains(e.target) || tiledCheck.checked) return;
  const cr = previewContainer.getBoundingClientRect();
  const ir = getImageRect();
  const pctX = Math.max(MIN_POS, Math.min(MAX_POS, (e.clientX - cr.left  - ir.x) / ir.w * 100));
  const pctY = Math.max(MIN_POS, Math.min(MAX_POS, (e.clientY - cr.top   - ir.y) / ir.h * 100));
  placeDragAt(pctX, pctY);
});

// ── Drag the watermark label ────────────────────────────────────────────────
let isDragging = false;

wmDrag.addEventListener('mousedown',  (e) => { e.preventDefault(); e.stopPropagation(); isDragging = true; });
wmDrag.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); isDragging = true; }, { passive: false });

function applyDrag(clientX, clientY) {
  const cr = previewContainer.getBoundingClientRect();
  const ir = getImageRect();
  const pctX = Math.max(MIN_POS, Math.min(MAX_POS, (clientX - cr.left - ir.x) / ir.w * 100));
  const pctY = Math.max(MIN_POS, Math.min(MAX_POS, (clientY - cr.top  - ir.y) / ir.h * 100));
  placeDragAt(pctX, pctY);
}

document.addEventListener('mousemove', (e) => {
  if (isDragging) applyDrag(e.clientX, e.clientY);
});
document.addEventListener('touchmove', (e) => {
  if (isDragging) { e.preventDefault(); applyDrag(e.touches[0].clientX, e.touches[0].clientY); }
}, { passive: false });
document.addEventListener('mouseup',  () => { isDragging = false; });
document.addEventListener('touchend', () => { isDragging = false; });
</script>
</body>
</html>
