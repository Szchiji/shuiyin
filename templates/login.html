<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 — 水印小程序</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 50%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(59,130,246,.13), 0 2px 8px rgba(0,0,0,.06);
      padding: 44px 48px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,.8);
    }
    h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 6px; letter-spacing: -.02em; }
    .subtitle { font-size: .875rem; color: #94a3b8; margin-bottom: 30px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: .82rem; font-weight: 700; color: #475569; margin-bottom: 7px; letter-spacing: .02em; text-transform: uppercase; }
    input[type="text"],
    input[type="password"],
    input[type="number"] {
      width: 100%;
      padding: 11px 15px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: .95rem;
      outline: none;
      background: #f8fafc;
      color: #1e293b;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    input:focus { border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 3px rgba(59,130,246,.14); }
    .hint { font-size: .77rem; color: #94a3b8; margin-top: 5px; line-height: 1.6; }
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .18s, box-shadow .18s, transform .12s;
      box-shadow: 0 4px 16px rgba(59,130,246,.35);
      letter-spacing: .01em;
    }
    .btn:hover { opacity: .92; box-shadow: 0 6px 22px rgba(59,130,246,.45); }
    .btn:active { transform: scale(.98); }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 11px 15px;
      font-size: .875rem;
      color: #b91c1c;
      margin-bottom: 18px;
    }
    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: .8rem;
      color: #1d4ed8;
      margin-top: 22px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🖼️ 水印小程序</h1>
  <p class="subtitle">请登录以使用水印功能</p>

  {% if error %}
  <div class="error">❌ {{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="field">
      <label for="user_id">Telegram 用户 ID</label>
      <input type="number" id="user_id" name="user_id" placeholder="如：123456789" required />
      <p class="hint">在 Telegram 发送 <b>/start</b> 给 @userinfobot 可查询你的 ID</p>
    </div>
    <div class="field">
      <label for="credential">登录凭证</label>
      <input type="password" id="credential" name="credential" placeholder="令牌 或 管理员密码" required />
      <p class="hint">普通/会员用户：在 Telegram 机器人发送 <b>/webtoken</b> 获取令牌<br>管理员：输入 WEB_ADMIN_PASSWORD</p>
    </div>
    <button type="submit" class="btn">登录</button>
  </form>

  <div class="info-box">
    💡 <b>如何获取令牌？</b><br>
    在 Telegram 中找到本机器人，发送命令 <code>/webtoken</code>，机器人会私信回复你的专属登录令牌。
  </div>
</div>
</body>
</html>
